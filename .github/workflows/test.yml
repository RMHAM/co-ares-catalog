name: Test

on:
  push:
  pull_request:

jobs:
  test-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Test
        working-directory: web
        run: |
          npm ci
          npm run build

  test-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Test
        working-directory: functions
        run: |
          npm ci
          npm run lint
          npm run build

  test-firestore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Setup Java 21+
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test
        working-directory: firestore
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: |
          npm ci
          npm run test


  test-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: data/js/package-lock.json

      - name: Test data tooling
        working-directory: data/js
        run: |
          npm ci
          npm run lint
          npm run build
          npm test -- --runInBand
